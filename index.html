<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPS Timer</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<header>
<h1>EPS Timer</h1>
</header>

<div class="container">

<h2>Timer Classique</h2>

<div class="form-group">
<label>Temps de travail (s)</label>
<input type="number" id="workTime" value="30">
</div>

<div class="form-group">
<label>Temps de récupération (s)</label>
<input type="number" id="restTime" value="30">
</div>

<div class="form-group">
<label>Nombre de séries</label>
<input type="number" id="sets" value="10">
</div>

<div class="form-group">
<label>Nombre de cycles</label>
<input type="number" id="cycles" value="3">
</div>

<div class="form-group">
<label>Repos entre cycles (s)</label>
<input type="number" id="cycleRest" value="120">
</div>

<button onclick="startTimer()">
Démarrer
</button>

<button onclick="toggleFullscreen()">
Plein écran
</button>

</div>

<div id="display">

<h1 id="phase">
PRÊT
</h1>

<h2 id="timer">
00:00
</h2>

<p id="status">
Série 0 / 0
</p>

</div>

<script src="app.js"></script>

</body>
</html>
